<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" width="360" height="110" role="img" aria-label="Kiwi Nails Fasteners Ltd">
  <defs>
    <linearGradient id="kn-orange" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F4A02C"/>
      <stop offset="1" stop-color="#D8541A"/>
    </linearGradient>
    <linearGradient id="kn-grey" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8a8a8a"/>
      <stop offset="1" stop-color="#3f3f3f"/>
    </linearGradient>
  </defs>
  <!-- Grey upper sweep -->
  <path d="M 18 38
           C 38 6, 90 6, 116 28
           C 92 22, 64 30, 50 52
           C 44 64, 38 62, 30 56 Z"
        fill="url(#kn-grey)" opacity="0.85"/>
  <!-- Orange lower hook + nail point -->
  <path d="M 24 50
           C 50 80, 100 78, 116 56
           L 138 64
           L 132 70
           L 124 66
           C 110 88, 70 96, 40 78
           C 32 74, 26 62, 24 50 Z"
        fill="url(#kn-orange)"/>
  <!-- Hook nail tip highlight -->
  <polygon points="138,64 154,68 144,72 132,70" fill="#1f1f1f"/>
  <!-- Wordmark -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#1f1f1f">
    <text x="170" y="56" font-size="30" font-weight="800" letter-spacing="1">KIWI NAILS</text>
    <text x="170" y="80" font-size="14" font-weight="600" letter-spacing="6" fill="#5a5a5a">FASTENERS LTD</text>
  </g>
</svg>
